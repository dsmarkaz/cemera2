<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receiver Console</title>
  
  <!-- PeerJS لائبریری -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html { 
      height: 100%; 
      width: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: #010a05; 
      background-image: url('a.jpg'); 
      background-size: cover; 
      background-position: center; 
      overflow-y: auto; 
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .status-bar {
      font-size: 13px;
      color: #00ff87;
      letter-spacing: 1px;
      margin-bottom: 20px;
      font-weight: 600;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: inline-block;
    }

    /* ویڈیو کارڈز کا سائز (Laptop screen ka 1/4th size per video) */
    .streams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 1200px;
    }

    .glass-card {
      position: relative;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      padding: 12px;
      transition: all 0.3s ease;
    }

    /* منیمائز (Minimize) حالت */
    .glass-card.minimized {
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.7);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .glass-card.minimized .video-frame-card {
      display: none;
    }

    .glass-card.minimized .controls-bar {
      margin-top: 0;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .card-status {
      font-size: 11px;
      color: #00ff87;
      font-weight: 700;
      text-align: left;
    }

    .card-status.offline {
      color: #ff4757;
    }

    /* کلوز بٹن (❌) */
    .card-close-btn {
      background: rgba(239, 68, 68, 0.8);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .card-close-btn:hover {
      background: #ef4444;
      transform: scale(1.1);
    }

    .video-frame-card {
      position: relative;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      height: 180px; /* Small Screen Size */
    }

    video { 
      width: 100%; 
      height: 100%;
      object-fit: cover;
      display: block; 
      border-radius: 12px; 
      background: #000; 
      transition: filter 0.3s ease; 
    }
    
    .video-blurred { filter: blur(25px); }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .timer {
      font-family: monospace;
      font-size: 12px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.5);
      padding: 3px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .icon-btns {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    .min-btn {
      background: rgba(234, 179, 8, 0.2);
      border-color: rgba(234, 179, 8, 0.5);
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="status-bar" id="status">Status: Connecting...</div>
    <div class="streams-grid" id="streamsGrid"></div>
  </div>

  <script>
    // Free Public TURN & STUN Servers Setup
    const peer = new Peer('danish-cam-9988', {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:stun3.l.google.com:19302' },
          { urls: 'stun:stun4.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' },
          {
            urls: 'turn:openrelay.metered.ca:80',
            username: 'openrelay',
            credential: 'openrelay'
          },
          {
            urls: 'turn:openrelay.metered.ca:443',
            username: 'openrelay',
            credential: 'openrelay'
          },
          {
            urls: 'turn:openrelay.metered.ca:443?transport=tcp',
            username: 'openrelay',
            credential: 'openrelay'
          }
        ]
      }
    });

    let totalUserCount = 0;
    let activeUserCount = 0;

    peer.on('open', () => {
      document.getElementById('status').innerText = "Status: Online | Waiting for users...";
    });

    peer.on('call', (call) => {
      totalUserCount++;
      activeUserCount++;
      updateMainStatus();

      call.answer();

      const callId = `User_${totalUserCount}_${Date.now()}`;

      call.on('stream', (remoteStream) => {
        createVideoCard(callId, remoteStream, totalUserCount, call);

        const videoTrack = remoteStream.getVideoTracks()[0];

        if (videoTrack) {
          videoTrack.onended = () => markUserDisconnected(callId);
        }

        call.on('close', () => markUserDisconnected(callId));
        call.on('error', () => markUserDisconnected(callId));
      });
    });

    function updateMainStatus() {
      document.getElementById('status').innerText = `Status: Online 🔴 (${activeUserCount} Active Live)`;
    }

    function createVideoCard(id, stream, userNumber, call) {
      const grid = document.getElementById('streamsGrid');

      const card = document.createElement('div');
      card.className = 'glass-card';
      card.id = `card_${id}`;

      card.innerHTML = `
        <div class="card-header">
          <div class="card-status" id="badge_${id}">🔴 USER #${userNumber} - LIVE</div>
          <button class="card-close-btn" title="Close" onclick="closeCard('${id}')">✖</button>
        </div>
        <div class="video-frame-card">
          <video id="video_${id}" autoplay playsinline muted></video>
        </div>
        <div class="controls-bar">
          <div class="timer" id="timer_${id}">00:00</div>
          <div class="icon-btns">
            <button class="icon-btn min-btn" id="minBtn_${id}" title="Minimize" onclick="toggleMinimize('${id}')">➖</button>
            <button class="icon-btn" id="blurBtn_${id}" title="Blur" onclick="toggleBlur('video_${id}')">👁️</button>
            <button class="icon-btn" title="Download" onclick="downloadVideo('${id}')">📥</button>
          </div>
        </div>
      `;

      grid.appendChild(card);

      const videoElem = document.getElementById(`video_${id}`);
      
      videoElem.srcObject = stream;
      videoElem.muted = true;
      videoElem.setAttribute('playsinline', 'true');
      videoElem.setAttribute('autoplay', 'true');
      videoElem._peerCall = call;

      videoElem.play().catch(err => console.log("Autoplay retrying:", err));

      // Recording Setup
      const chunks = [];
      let options = { mimeType: 'video/webm' };
      if (!MediaRecorder.isTypeSupported('video/webm')) {
        options = { mimeType: 'video/mp4' };
      }

      try {
        const mediaRecorder = new MediaRecorder(stream, options);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) chunks.push(e.data);
        };
        mediaRecorder.start(1000);
        videoElem._recorder = mediaRecorder;
      } catch(e) {
        console.log("Recorder setup error", e);
      }

      videoElem._chunks = chunks;

      // Timer Setup
      let seconds = 0;
      const timerElem = document.getElementById(`timer_${id}`);
      const timerInterval = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        timerElem.innerText = `${mins}:${secs}`;
      }, 1000);

      videoElem._timerInterval = timerInterval;
    }

    function markUserDisconnected(id) {
      const cardElem = document.getElementById(`card_${id}`);
      const videoElem = document.getElementById(`video_${id}`);
      const badgeElem = document.getElementById(`badge_${id}`);
      const blurBtn = document.getElementById(`blurBtn_${id}`);

      if (videoElem && videoElem._isDisconnected) return;
      if (videoElem) videoElem._isDisconnected = true;

      if (videoElem) {
        if (videoElem._timerInterval) clearInterval(videoElem._timerInterval);
        if (videoElem._recorder && videoElem._recorder.state !== "inactive") {
          videoElem._recorder.stop();
        }
      }

      if (cardElem) cardElem.classList.add('minimized');

      if (badgeElem) {
        badgeElem.innerText = "⚪ DISCONNECTED (Saved)";
        badgeElem.classList.add('offline');
      }

      if (blurBtn) blurBtn.style.display = 'none';

      activeUserCount--;
      if (activeUserCount < 0) activeUserCount = 0;
      updateMainStatus();
    }

    // دستی منیمائز اور میکسی مائز (➖)
    function toggleMinimize(id) {
      const card = document.getElementById(`card_${id}`);
      if (card) card.classList.toggle('minimized');
    }

    // کارڈ کلوز کرنے کا طریقہ (❌)
    function closeCard(id) {
      const videoElem = document.getElementById(`video_${id}`);
      if (videoElem && videoElem._peerCall) videoElem._peerCall.close();
      markUserDisconnected(id);
      const card = document.getElementById(`card_${id}`);
      if (card) card.remove();
    }

    function toggleBlur(videoId) {
      const video = document.getElementById(videoId);
      if (video) video.classList.toggle('video-blurred');
    }

    function downloadVideo(id) {
      const videoElem = document.getElementById(`video_${id}`);
      if (!videoElem || !videoElem._chunks || videoElem._chunks.length === 0) {
        alert("No recording available!");
        return;
      }

      if (videoElem._recorder && videoElem._recorder.state === "recording") {
        videoElem._recorder.requestData();
      }

      setTimeout(() => {
        const blob = new Blob(videoElem._chunks, { type: videoElem._recorder?.mimeType || 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `recording_${id}.webm`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
        }, 100);
      }, 200);
    }
  </script>
</body>
</html>
