<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Receiver Console</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* LINE 13: Background image URL */
    body, html { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #010a05; background-image: url(a.jpg); background-size: cover; background-position: center; overflow: hidden; }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Extremely Transparent Glass Card */
    .glass-card {
      position: relative;
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      padding: 16px;
      text-align: center;
    }

    .status-bar {
      font-size: 12px;
      color: #00ff87;
      letter-spacing: 1px;
      margin-bottom: 12px;
      font-weight: 600;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
    }

    .video-frame-card {
      position: relative;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    video { width: 100%; display: block; border-radius: 20px; background: #000; transition: filter 0.3s ease; }
    .video-blurred { filter: blur(25px); }

    /* YouTube-style Control Bar Overlay */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding: 4px 10px;
    }

    .timer {
      font-family: monospace;
      font-size: 14px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .icon-btns {
      display: flex;
      gap: 12px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="glass-card">
      <div class="status-bar" id="status">Waiting for connection...</div>

      <div class="video-frame-card">
        <video id="remoteFeed" autoplay playsinline></video>
      </div>

      <div class="controls-bar">
        <div class="timer" id="timer">00:00</div>
        <div class="icon-btns">
          <button class="icon-btn" title="Blur / Unblur" onclick="toggleBlur()">👁️</button>
          <button class="icon-btn" title="Download Recording" onclick="downloadVideoFile()">📥</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const peer = new Peer('my-secret-admin-id-1234');
    let mediaRecorder;
    let recordedChunks = [];
    let timerInterval = null;
    let secondsElapsed = 0;

    peer.on('open', () => {
      document.getElementById('status').innerText = "Status: Online | Waiting...";
    });

    peer.on('call', (call) => {
      document.getElementById('status').innerText = "Status: Live 🔴";
      call.answer();

      call.on('stream', (remoteStream) => {
        const videoElem = document.getElementById('remoteFeed');
        videoElem.srcObject = remoteStream;

        recordedChunks = [];
        startTimer();

        mediaRecorder = new MediaRecorder(remoteStream);
        
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) recordedChunks.push(event.data);
        };

        mediaRecorder.start();

        remoteStream.getVideoTracks()[0].onended = () => {
          document.getElementById('status').innerText = "Status: Disconnected";
          stopTimer();
          if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
          }
        };
      });
    });

    function toggleBlur() {
      const video = document.getElementById('remoteFeed');
      video.classList.toggle('video-blurred');
    }

    function startTimer() {
      stopTimer();
      secondsElapsed = 0;
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
    }

    function downloadVideoFile() {
      if (!recordedChunks.length) {
        alert("No recording available to download!");
        return;
      }
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `recording_${Date.now()}.webm`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
