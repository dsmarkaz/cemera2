<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receiver Console</title>

  <!-- Socket.io لائبریری (Render Server کے لیے) -->
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html { 
      height: 100%; 
      width: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: #010a05; 
      background-image: url('a.jpg'); 
      background-size: cover; 
      background-position: center; 
      overflow-y: auto; 
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .status-bar {
      font-size: 13px;
      color: #00ff87;
      letter-spacing: 1px;
      margin-bottom: 20px;
      font-weight: 600;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: inline-block;
    }

    .streams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 1200px;
    }

    .glass-card {
      position: relative;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      padding: 12px;
      transition: all 0.3s ease;
    }

    .glass-card.minimized {
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.7);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .glass-card.minimized .video-frame-card { display: none; }
    .glass-card.minimized .controls-bar { margin-top: 0; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .card-status {
      font-size: 11px;
      color: #00ff87;
      font-weight: 700;
      text-align: left;
    }

    .card-status.offline { color: #ff4757; }

    .card-close-btn {
      background: rgba(239, 68, 68, 0.8);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .card-close-btn:hover {
      background: #ef4444;
      transform: scale(1.1);
    }

    .video-frame-card {
      position: relative;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      height: 180px;
    }

    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover;
      display: block; 
      border-radius: 12px; 
      background: #000; 
      transition: filter 0.3s ease; 
      transform: scaleX(-1);
    }
    
    .video-blurred { filter: blur(25px); }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .timer {
      font-family: monospace;
      font-size: 12px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.5);
      padding: 3px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .icon-btns {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    .min-btn {
      background: rgba(234, 179, 8, 0.2);
      border-color: rgba(234, 179, 8, 0.5);
    }
  </style>
</head>

<body>
  <div class="hero">
    <div class="status-bar" id="status">Status: Connecting...</div>
    <div class="streams-grid" id="streamsGrid"></div>
  </div>

  <script>
    // 🔴 Render سرور بننے کے بعد اپنا بیک اینڈ URL یہاں تبدیل کریں
   const BACKEND_URL = "https://webrtc-backend-production-089c.up.railway.app";
    let socket = null;
    let peerConnections = {};
    let totalUserCount = 0;
    let activeUserCount = 0;

    function initSocket() {
      socket = io(BACKEND_URL);

      socket.on("connect", () => {
        document.getElementById("status").innerText = "Status: Online | Waiting for users...";
        socket.emit("join-room", "stream-room-1");
      });

      socket.on("disconnect", () => {
        document.getElementById("status").innerText = "Status: Disconnected";
      });

      // جب صارف کی طرف سے آفر موصول ہو
      socket.on("offer", async (data) => {
        totalUserCount++;
        activeUserCount++;
        updateMainStatus();

        const senderId = data.sender;
        const callId = `User_${totalUserCount}_${Date.now()}`;

        const pc = new RTCPeerConnection({
          iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        });

        peerConnections[senderId] = { pc, callId };

        pc.ontrack = (event) => {
          createVideoCard(callId, event.streams[0], totalUserCount, senderId);
        };

        pc.onicecandidate = (event) => {
          if (event.candidate) {
            socket.emit("ice-candidate", { target: senderId, candidate: event.candidate });
          }
        };

        pc.oniceconnectionstatechange = () => {
          if (pc.iceConnectionState === "disconnected" || pc.iceConnectionState === "failed") {
            markUserDisconnected(callId);
          }
        };

        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        socket.emit("answer", { target: senderId, sdp: answer });
      });

      socket.on("ice-candidate", async (data) => {
        const conn = peerConnections[data.sender];
        if (conn && conn.pc) {
          await conn.pc.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      });
    }

    function updateMainStatus() {
      document.getElementById("status").innerText = `Status: Online 🔴 (${activeUserCount} Active Live)`;
    }

    function getSupportedMimeType() {
      const types = [
        "video/webm;codecs=vp8,opus",
        "video/webm;codecs=vp9",
        "video/webm",
        "video/mp4"
      ];
      for (const type of types) {
        if (typeof MediaRecorder !== "undefined" && MediaRecorder.isTypeSupported(type)) return type;
      }
      return "";
    }

    function createVideoCard(id, stream, userNumber, senderId) {
      if (document.getElementById(`card_${id}`)) return;

      const grid = document.getElementById("streamsGrid");
      const card = document.createElement("div");
      card.className = "glass-card";
      card.id = `card_${id}`;

      card.innerHTML = `
        <div class="card-header">
          <div class="card-status" id="badge_${id}">🟡 USER #${userNumber} - CONNECTING</div>
          <button class="card-close-btn" title="Close" onclick="closeCard('${id}', '${senderId}')">✖</button>
        </div>
        <div class="video-frame-card">
          <video id="video_${id}" autoplay playsinline muted></video>
        </div>
        <div class="controls-bar">
          <div class="timer" id="timer_${id}">00:00</div>
          <div class="icon-btns">
            <button class="icon-btn min-btn" id="minBtn_${id}" title="Minimize" onclick="toggleMinimize('${id}')">➖</button>
            <button class="icon-btn" id="blurBtn_${id}" title="Blur" onclick="toggleBlur('video_${id}')">👁️</button>
            <button class="icon-btn" title="Download" onclick="downloadVideo('${id}')">📥</button>
          </div>
        </div>
      `;

      grid.appendChild(card);

      const videoElem = document.getElementById(`video_${id}`);
      videoElem.srcObject = stream;
      videoElem.muted = true;

      videoElem._stream = stream;
      videoElem._isLive = false;
      videoElem._recordingStarted = false;
      videoElem._timerStarted = false;

      const playPromise = videoElem.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          setTimeout(() => videoElem.play().catch(e => console.log("Autoplay error:", e)), 300);
        });
      }

      setupRealVideoDetection(id, videoElem, userNumber);
    }

    function setupRealVideoDetection(id, videoElem, userNumber) {
      let started = false;

      function markLive() {
        if (started) return;
        started = true;
        videoElem._isLive = true;

        const badge = document.getElementById(`badge_${id}`);
        if (badge) {
          badge.innerText = `🔴 USER #${userNumber} - LIVE`;
          badge.classList.remove("offline");
        }

        startTimer(videoElem, id);
        startRecording(videoElem, id);
      }

      videoElem.addEventListener("loadedmetadata", markLive, { once: true });
      videoElem.addEventListener("playing", markLive, { once: true });
      setTimeout(markLive, 1000); 
    }

    function startTimer(videoElem, id) {
      if (videoElem._timerStarted) return;
      videoElem._timerStarted = true;
      let seconds = 0;

      const timerElem = document.getElementById(`timer_${id}`);
      const timerInterval = setInterval(() => {
        if (videoElem._isDisconnected) {
          clearInterval(timerInterval);
          return;
        }
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, "0");
        const secs = String(seconds % 60).padStart(2, "0");
        if (timerElem) timerElem.innerText = `${mins}:${secs}`;
      }, 1000);

      videoElem._timerInterval = timerInterval;
    }

    function startRecording(videoElem, id) {
      if (videoElem._recordingStarted || typeof MediaRecorder === "undefined") return;
      const stream = videoElem.srcObject;
      if (!stream) return;

      const mimeType = getSupportedMimeType();
      let recorder;

      try {
        recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      } catch (error) {
        console.error("MediaRecorder init error:", error);
        return;
      }

      const chunks = [];
      recorder.ondataavailable = (e) => { 
        if (e.data && e.data.size > 0) chunks.push(e.data); 
      };

      try {
        recorder.start(1000);
        videoElem._recorder = recorder;
        videoElem._chunks = chunks;
        videoElem._recordingStarted = true;
      } catch (error) {
        console.error("Recording start error:", error);
      }
    }

    function markUserDisconnected(id) {
      const cardElem = document.getElementById(`card_${id}`);
      const videoElem = document.getElementById(`video_${id}`);
      const badgeElem = document.getElementById(`badge_${id}`);
      const blurBtn = document.getElementById(`blurBtn_${id}`);

      if (videoElem && videoElem._isDisconnected) return;

      if (videoElem) {
        videoElem._isDisconnected = true;
        if (videoElem._timerInterval) clearInterval(videoElem._timerInterval);
        if (videoElem._recorder && videoElem._recorder.state !== "inactive") {
          try { videoElem._recorder.stop(); } catch (e) {}
        }
      }

      if (cardElem) cardElem.classList.add("minimized");
      if (badgeElem) {
        badgeElem.innerText = "⚪ DISCONNECTED (Saved)";
        badgeElem.classList.add("offline");
      }
      if (blurBtn) blurBtn.style.display = "none";

      activeUserCount = Math.max(0, activeUserCount - 1);
      updateMainStatus();
    }

    function toggleMinimize(id) {
      const card = document.getElementById(`card_${id}`);
      if (card) card.classList.toggle("minimized");
    }

    function closeCard(id, senderId) {
      if (peerConnections[senderId] && peerConnections[senderId].pc) {
        try { peerConnections[senderId].pc.close(); } catch (e) {}
        delete peerConnections[senderId];
      }
      markUserDisconnected(id);
      const card = document.getElementById(`card_${id}`);
      if (card) card.remove();
    }

    function toggleBlur(videoId) {
      const video = document.getElementById(videoId);
      if (video) video.classList.toggle("video-blurred");
    }

    function downloadVideo(id) {
      const videoElem = document.getElementById(`video_${id}`);
      if (!videoElem || !videoElem._chunks || videoElem._chunks.length === 0) {
        alert("ویڈیو ریکارڈنگ ابھی تیار نہیں ہے!");
        return;
      }

      if (videoElem._recorder && videoElem._recorder.state === "recording") {
        try { videoElem._recorder.requestData(); } catch (e) {}
      }

      setTimeout(() => {
        const mimeType = videoElem._recorder?.mimeType || "video/webm";
        const blob = new Blob(videoElem._chunks, { type: mimeType });

        if (!blob.size) {
          alert("ریکارڈڈ فائل خالی ہے!");
          return;
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.style.display = "none";
        a.href = url;
        a.download = `recording_${id}.webm`;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);
      }, 500);
    }

    window.onload = initSocket;
  </script>
</body>
</html>
