<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receiver Console</title>

  <!-- PeerJS لائبریری -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html { 
      height: 100%; 
      width: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: #010a05; 
      background-image: url('a.jpg'); 
      background-size: cover; 
      background-position: center; 
      overflow-y: auto; 
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .status-bar {
      font-size: 13px;
      color: #00ff87;
      letter-spacing: 1px;
      margin-bottom: 20px;
      font-weight: 600;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: inline-block;
    }

    .streams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 1200px;
    }

    .glass-card {
      position: relative;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      padding: 12px;
      transition: all 0.3s ease;
    }

    .glass-card.minimized {
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.7);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .glass-card.minimized .video-frame-card { display: none; }
    .glass-card.minimized .controls-bar { margin-top: 0; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .card-status {
      font-size: 11px;
      color: #00ff87;
      font-weight: 700;
      text-align: left;
    }

    .card-status.offline { color: #ff4757; }

    .card-close-btn {
      background: rgba(239, 68, 68, 0.8);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .card-close-btn:hover {
      background: #ef4444;
      transform: scale(1.1);
    }

    .video-frame-card {
      position: relative;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      height: 180px;
    }

    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover;
      display: block; 
      border-radius: 12px; 
      background: #000; 
      transition: filter 0.3s ease; 
    }
    
    .video-blurred { filter: blur(25px); }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .timer {
      font-family: monospace;
      font-size: 12px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.5);
      padding: 3px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .icon-btns {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    .min-btn {
      background: rgba(234, 179, 8, 0.2);
      border-color: rgba(234, 179, 8, 0.5);
    }
  </style>
</head>

<body>
  <div class="hero">
    <div class="status-bar" id="status">Status: Connecting...</div>
    <div class="streams-grid" id="streamsGrid"></div>
  </div>

  <script>
    /* METERED TURN Creds */
    const METERED_USERNAME = "89e52e462d770536efbe1fa511a5edaa5fe8";
    const METERED_CREDENTIAL = "kQh1+S+i0r/K4P50";

    /* PEERJS SETUP */
    const peer = new Peer("danish-cam-9988", {
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          { urls: "turn:global.relay.metered.ca:80", username: METERED_USERNAME, credential: METERED_CREDENTIAL },
          { urls: "turn:global.relay.metered.ca:80?transport=tcp", username: METERED_USERNAME, credential: METERED_CREDENTIAL },
          { urls: "turn:global.relay.metered.ca:443", username: METERED_USERNAME, credential: METERED_CREDENTIAL },
          { urls: "turns:global.relay.metered.ca:443?transport=tcp", username: METERED_USERNAME, credential: METERED_CREDENTIAL }
        ],
        iceTransportPolicy: "all"
      }
    });

    let totalUserCount = 0;
    let activeUserCount = 0;

    peer.on("open", () => {
      document.getElementById("status").innerText = "Status: Online | Waiting for users...";
      console.log("ADMIN PEER ONLINE");
    });

    peer.on("error", (error) => {
      console.error("PeerJS ERROR:", error);
      document.getElementById("status").innerText = "Status: Connection Error";
    });

    peer.on("call", (call) => {
      totalUserCount++;
      activeUserCount++;
      updateMainStatus();

      try {
        call.answer();
      } catch (error) {
        console.error("Call answer error:", error);
      }

      const callId = `User_${totalUserCount}_${Date.now()}`;

      call.on("stream", (remoteStream) => {
        createVideoCard(callId, remoteStream, totalUserCount, call);
      });

      call.on("close", () => markUserDisconnected(callId));
      call.on("error", (error) => markUserDisconnected(callId));
    });

    function updateMainStatus() {
      document.getElementById("status").innerText = `Status: Online 🔴 (${activeUserCount} Active Live)`;
    }

    function getSupportedMimeType() {
      const types = ["video/webm;codecs=vp8", "video/webm;codecs=vp9", "video/webm"];
      for (const type of types) {
        if (typeof MediaRecorder !== "undefined" && MediaRecorder.isTypeSupported(type)) return type;
      }
      return "";
    }

    function createVideoCard(id, stream, userNumber, call) {
      const grid = document.getElementById("streamsGrid");
      const card = document.createElement("div");
      card.className = "glass-card";
      card.id = `card_${id}`;

      card.innerHTML = `
        <div class="card-header">
          <div class="card-status" id="badge_${id}">🟡 USER #${userNumber} - CONNECTING</div>
          <button class="card-close-btn" title="Close" onclick="closeCard('${id}')">✖</button>
        </div>
        <div class="video-frame-card">
          <video id="video_${id}" autoplay playsinline muted></video>
        </div>
        <div class="controls-bar">
          <div class="timer" id="timer_${id}">00:00</div>
          <div class="icon-btns">
            <button class="icon-btn min-btn" id="minBtn_${id}" title="Minimize" onclick="toggleMinimize('${id}')">➖</button>
            <button class="icon-btn" id="blurBtn_${id}" title="Blur" onclick="toggleBlur('video_${id}')">👁️</button>
            <button class="icon-btn" title="Download" onclick="downloadVideo('${id}')">📥</button>
          </div>
        </div>
      `;

      grid.appendChild(card);

      const videoElem = document.getElementById(`video_${id}`);
      videoElem.srcObject = stream;
      videoElem.muted = true;
      videoElem.autoplay = true;
      videoElem.playsInline = true;

      videoElem._peerCall = call;
      videoElem._stream = stream;
      videoElem._isLive = false;
      videoElem._recordingStarted = false;
      videoElem._timerStarted = false;

      const videoTracks = stream.getVideoTracks();
      if (!videoTracks.length) {
        setCardStatus(id, "🔴 USER #" + userNumber + " - NO VIDEO");
        return;
      }

      videoTracks[0].onended = () => markUserDisconnected(id);

      videoElem.play().catch(() => {
        setTimeout(() => videoElem.play().catch(e => console.log(e)), 500);
      });

      setupRealVideoDetection(id, videoElem, userNumber);
      monitorConnection(id, call);
    }

    function setupRealVideoDetection(id, videoElem, userNumber) {
      let frameCount = 0;
      let started = false;

      function markLive() {
        if (started) return;
        started = true;
        videoElem._isLive = true;

        const badge = document.getElementById(`badge_${id}`);
        if (badge) {
          badge.innerText = `🔴 USER #${userNumber} - LIVE`;
          badge.classList.remove("offline");
        }

        startTimer(videoElem, id);
        startRecording(videoElem, id);
      }

      if ("requestVideoFrameCallback" in videoElem) {
        function checkFrame() {
          frameCount++;
          if (frameCount >= 2) markLive();
          else videoElem.requestVideoFrameCallback(checkFrame);
        }
        videoElem.requestVideoFrameCallback(checkFrame);
      } else {
        videoElem.addEventListener("playing", () => setTimeout(markLive, 300), { once: true });
      }
    }

    function startTimer(videoElem, id) {
      if (videoElem._timerStarted) return;
      videoElem._timerStarted = true;
      let seconds = 0;

      const timerElem = document.getElementById(`timer_${id}`);
      const timerInterval = setInterval(() => {
        if (videoElem._isDisconnected) {
          clearInterval(timerInterval);
          return;
        }
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, "0");
        const secs = String(seconds % 60).padStart(2, "0");
        if (timerElem) timerElem.innerText = `${mins}:${secs}`;
      }, 1000);

      videoElem._timerInterval = timerInterval;
    }

    function startRecording(videoElem, id) {
      if (videoElem._recordingStarted || typeof MediaRecorder === "undefined") return;
      const stream = videoElem.srcObject;
      if (!stream || !stream.getVideoTracks().length) return;

      const mimeType = getSupportedMimeType();
      let recorder;

      try {
        recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      } catch (error) {
        console.error("MediaRecorder failure:", error);
        return;
      }

      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };

      try {
        recorder.start(1000);
        videoElem._recorder = recorder;
        videoElem._chunks = chunks;
        videoElem._recordingStarted = true;
      } catch (error) {
        console.error("Recording start error:", error);
      }
    }

    function monitorConnection(id, call) {
      const pc = call.peerConnection;
      if (!pc) return;

      const showState = () => {
        if ((pc.iceConnectionState === "failed" || pc.connectionState === "failed")) {
          const badge = document.getElementById(`badge_${id}`);
          if (badge && !document.getElementById(`video_${id}`)?._isLive) {
            badge.innerText = "🔴 CONNECTION FAILED";
            badge.classList.add("offline");
          }
        }
      };

      pc.addEventListener("iceconnectionstatechange", showState);
      pc.addEventListener("connectionstatechange", showState);
    }

    function setCardStatus(id, text) {
      const badge = document.getElementById(`badge_${id}`);
      if (badge) badge.innerText = text;
    }

    function markUserDisconnected(id) {
      const cardElem = document.getElementById(`card_${id}`);
      const videoElem = document.getElementById(`video_${id}`);
      const badgeElem = document.getElementById(`badge_${id}`);
      const blurBtn = document.getElementById(`blurBtn_${id}`);

      if (videoElem && videoElem._isDisconnected) return;

      if (videoElem) {
        videoElem._isDisconnected = true;
        if (videoElem._timerInterval) clearInterval(videoElem._timerInterval);
        if (videoElem._recorder && videoElem._recorder.state !== "inactive") {
          try { videoElem._recorder.stop(); } catch (e) {}
        }
      }

      if (cardElem) cardElem.classList.add("minimized");
      if (badgeElem) {
        badgeElem.innerText = "⚪ DISCONNECTED (Saved)";
        badgeElem.classList.add("offline");
      }
      if (blurBtn) blurBtn.style.display = "none";

      activeUserCount = Math.max(0, activeUserCount - 1);
      updateMainStatus();
    }

    function toggleMinimize(id) {
      const card = document.getElementById(`card_${id}`);
      if (card) card.classList.toggle("minimized");
    }

    function closeCard(id) {
      const videoElem = document.getElementById(`video_${id}`);
      if (videoElem && videoElem._peerCall) {
        try { videoElem._peerCall.close(); } catch (e) {}
      }
      markUserDisconnected(id);
      const card = document.getElementById(`card_${id}`);
      if (card) card.remove();
    }

    function toggleBlur(videoId) {
      const video = document.getElementById(videoId);
      if (video) video.classList.toggle("video-blurred");
    }

    function downloadVideo(id) {
      const videoElem = document.getElementById(`video_${id}`);
      if (!videoElem || !videoElem._chunks) {
        alert("No recording available!");
        return;
      }

      if (videoElem._recorder && videoElem._recorder.state === "recording") {
        try { videoElem._recorder.requestData(); } catch (e) {}
      }

      setTimeout(() => {
        if (!videoElem._chunks || videoElem._chunks.length === 0) {
          alert("No recording available!");
          return;
        }

        const mimeType = videoElem._recorder?.mimeType || "video/webm";
        const blob = new Blob(videoElem._chunks, { type: mimeType });

        if (!blob.size) {
          alert("Recording file is empty!");
          return;
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.style.display = "none";
        a.href = url;
        a.download = `recording_${id}.webm`;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);
      }, 800);
    }
  </script>
</body>
</html>
