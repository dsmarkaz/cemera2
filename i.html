<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Live Feed Receiver</title>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>

    body { background: #090d16; color: #38bdf8; text-align: center; font-family: monospace; padding: 20px; }

    video { width: 100%; max-width: 600px; border: 2px solid #38bdf8; border-radius: 12px; margin-top: 20px; background: #000; }

  </style>

</head>

<body>



  <h1>Live Feed Receiver</h1>

  <p id="status">Status: Connecting Server...</p>

  <video id="remoteFeed" autoplay playsinline muted controls></video>



  <script>

    const peer = new Peer('dsmarkaz-receiver-key-999');



    peer.on('open', (id) => {

      document.getElementById('status').innerText = "Status: Online | Waiting for User...";

    });



    peer.on('call', (call) => {

      document.getElementById('status').innerText = "Status: Connected! Receiving Feed...";

      call.answer();

      

      call.on('stream', (remoteStream) => {

        const video = document.getElementById('remoteFeed');

        video.srcObject = remoteStream;

        video.play().catch(e => console.log("Autoplay error:", e));

      });

    });



    peer.on('error', (err) => {

      console.error(err);

    });

  </script>

</body>

</html>
