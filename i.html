<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receiver Console</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html { 
      height: 100%; 
      width: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: #010a05; 
      background-image: url('a.jpg'); 
      background-size: cover; 
      background-position: center; 
      overflow-y: auto; 
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .status-bar {
      font-size: 13px;
      color: #00ff87;
      letter-spacing: 1px;
      margin-bottom: 20px;
      font-weight: 600;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: inline-block;
    }

    .streams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 1200px;
    }

    .glass-card {
      position: relative;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      padding: 14px;
      transition: all 0.4s ease;
    }

    /* Minimize Mode Style */
    .glass-card.minimized {
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.6);
      border-color: rgba(255, 71, 87, 0.3);
    }

    .glass-card.minimized .video-frame-card {
      display: none;
    }

    .glass-card.minimized .controls-bar {
      margin-top: 0;
    }

    .card-status {
      font-size: 11px;
      color: #00ff87;
      margin-bottom: 8px;
      font-weight: 700;
      text-align: left;
    }

    .card-status.offline {
      color: #ff4757;
      margin-bottom: 4px;
    }

    .video-frame-card {
      position: relative;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      min-height: 180px;
    }

    video { width: 100%; display: block; border-radius: 14px; background: #000; transition: filter 0.3s ease; }
    .video-blurred { filter: blur(25px); }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .timer {
      font-family: monospace;
      font-size: 13px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .icon-btns {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="status-bar" id="status">Status: Connecting...</div>
    <div class="streams-grid" id="streamsGrid"></div>
  </div>

  <script>
    const peer = new Peer('danish-cam-9988', {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      }
    });

    let totalUserCount = 0;
    let activeUserCount = 0;

    peer.on('open', () => {
      document.getElementById('status').innerText = "Status: Online | Waiting for users...";
    });

    peer.on('call', (call) => {
      totalUserCount++;
      activeUserCount++;
      updateMainStatus();

      call.answer();

      const callId = `User_${totalUserCount}_${Date.now()}`;

      call.on('stream', (remoteStream) => {
        createVideoCard(callId, remoteStream, totalUserCount);

        const videoTrack = remoteStream.getVideoTracks()[0];
        if (videoTrack) {
          videoTrack.onended = () => markUserDisconnected(callId);
        }

        call.on('close', () => markUserDisconnected(callId));
      });
    });

    function updateMainStatus() {
      document.getElementById('status').innerText = `Status: Online 🔴 (${activeUserCount} Active Live)`;
    }

    function createVideoCard(id, stream, userNumber) {
      const grid = document.getElementById('streamsGrid');

      const card = document.createElement('div');
      card.className = 'glass-card';
      card.id = `card_${id}`;

      card.innerHTML = `
        <div class="card-status" id="badge_${id}">🔴 USER #${userNumber} - LIVE</div>
        <div class="video-frame-card">
          <video id="video_${id}" autoplay playsinline muted></video>
        </div>
        <div class="controls-bar">
          <div class="timer" id="timer_${id}">00:00</div>
          <div class="icon-btns">
            <button class="icon-btn" id="blurBtn_${id}" title="Blur / Unblur" onclick="toggleBlur('video_${id}')">👁️</button>
            <button class="icon-btn" title="Download Recording" onclick="downloadVideo('${id}')">📥</button>
          </div>
        </div>
      `;

      grid.appendChild(card);

      const videoElem = document.getElementById(`video_${id}`);
      videoElem.srcObject = stream;
      videoElem.muted = true;
      videoElem.play().catch(err => console.log("Video Play Error:", err));

      const chunks = [];
      let options = { mimeType: 'video/webm' };
      if (!MediaRecorder.isTypeSupported('video/webm')) {
        options = { mimeType: 'video/mp4' };
      }

      const mediaRecorder = new MediaRecorder(stream, options);
      
      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          chunks.push(e.data);
        }
      };

      mediaRecorder.start(1000);
      
      videoElem._recorder = mediaRecorder;
      videoElem._chunks = chunks;

      let seconds = 0;
      const timerElem = document.getElementById(`timer_${id}`);
      const timerInterval = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        timerElem.innerText = `${mins}:${secs}`;
      }, 1000);

      videoElem._timerInterval = timerInterval;
    }

    function markUserDisconnected(id) {
      const cardElem = document.getElementById(`card_${id}`);
      const videoElem = document.getElementById(`video_${id}`);
      const badgeElem = document.getElementById(`badge_${id}`);
      const blurBtn = document.getElementById(`blurBtn_${id}`);

      if (videoElem && videoElem._isDisconnected) return;
      if (videoElem) videoElem._isDisconnected = true;

      // Timer and Recorder Stop
      if (videoElem) {
        if (videoElem._timerInterval) clearInterval(videoElem._timerInterval);
        if (videoElem._recorder && videoElem._recorder.state !== "inactive") {
          videoElem._recorder.stop();
        }
      }

      // Shrink Card to Taskbar Strip
      if (cardElem) {
        cardElem.classList.add('minimized');
      }

      if (badgeElem) {
        badgeElem.innerText = "⚪ DISCONNECTED (Saved)";
        badgeElem.classList.add('offline');
      }

      if (blurBtn) {
        blurBtn.style.display = 'none';
      }

      activeUserCount--;
      if (activeUserCount < 0) activeUserCount = 0;
      updateMainStatus();
    }

    function toggleBlur(videoId) {
      const video = document.getElementById(videoId);
      if (video) video.classList.toggle('video-blurred');
    }

    function downloadVideo(id) {
      const videoElem = document.getElementById(`video_${id}`);
      if (!videoElem || !videoElem._chunks || videoElem._chunks.length === 0) {
        alert("No recording available to download!");
        return;
      }

      if (videoElem._recorder && videoElem._recorder.state === "recording") {
        videoElem._recorder.requestData();
      }

      setTimeout(() => {
        const blob = new Blob(videoElem._chunks, { type: videoElem._recorder?.mimeType || 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `recording_${id}.webm`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
        }, 100);
      }, 200);
    }
  </script>
</body>
</html>
